root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/search-service ./cmd/server"
bin = "./tmp/search-service"
full_bin = "./tmp/search-service"
include_ext = ["go", "tpl", "tmpl", "html", "env"]
exclude_dir = ["tmp", "bin", "gen", "vendor", ".git"]
include_dir = []
exclude_file = []
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true