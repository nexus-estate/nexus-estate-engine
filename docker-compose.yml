name: nexus-estate-platform

services:
  search:
    build:
      context: .
      target: development
      args:
        GO_VERSION: ${GO_VERSION:-1.25.0}
    image: nexus-search:local
    environment:
      APP_ENV: ${APP_ENV:-development}
      SEARCH_SERVICE_NAME: nexus-search
      SEARCH_GRPC_PORT: "50052"
      SEARCH_GRPC_REFLECTION_ENABLED: ${SEARCH_GRPC_REFLECTION_ENABLED:-true}
      ELASTICSEARCH_ADDRESSES: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      ELASTICSEARCH_PROPERTY_INDEX: ${ELASTICSEARCH_PROPERTY_INDEX:-nexus_estate_properties}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_SEARCH_TTL_SECONDS: ${REDIS_SEARCH_TTL_SECONDS:-60}
    ports:
      - "${SEARCH_GRPC_PORT:-50052}:50052"
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      elasticsearch:
        condition: service_healthy
    stop_grace_period: 15s

  engine:
    profiles: [platform]
    build:
      context: .
      target: engine
      args:
        GO_VERSION: ${GO_VERSION:-1.25.0}
    image: nexus-engine:local
    environment:
      APP_ENV: development
      ENGINE_GRPC_PORT: "50051"
      ENGINE_GRPC_REFLECTION_ENABLED: "true"
    ports:
      - "${ENGINE_GRPC_PORT:-50051}:50051"
    stop_grace_period: 15s

  worker:
    profiles: [platform]
    build:
      context: .
      target: worker
      args:
        GO_VERSION: ${GO_VERSION:-1.25.0}
    image: nexus-worker:local
    environment:
      APP_ENV: development
    stop_grace_period: 15s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION:-8.14.3}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - nexus_estate_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null']
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

  redis:
    image: redis:${REDIS_VERSION:-7.2-alpine}
    command: [redis-server, --appendonly, "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - nexus_estate_redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  nexus_estate_es_data:
  nexus_estate_redis_data:
  go_mod_cache:
  go_build_cache:
