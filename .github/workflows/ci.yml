name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned protobuf tools
        run: |
          PROTOC_VERSION=$(awk '/^PROTOC_VERSION :=/ {print $3}' Makefile)
          GO_PLUGIN_VERSION=$(awk '/^PROTOC_GEN_GO_VERSION :=/ {print $3}' Makefile)
          GRPC_PLUGIN_VERSION=$(awk '/^PROTOC_GEN_GO_GRPC_VERSION :=/ {print $3}' Makefile)
          curl --fail --location --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" -o "$RUNNER_TEMP/protoc.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@"$GO_PLUGIN_VERSION"
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@"$GRPC_PLUGIN_VERSION"
      - name: Verify generated protobuf code
        run: |
          make proto
          git diff --exit-code -- proto gen
      - run: go mod download
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: --timeout=5m
      - run: go test -race ./...
      - name: Module tidiness
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  build-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make build

  docker:
    runs-on: ubuntu-latest
    needs: [quality, build-binaries]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        runtime: [search, engine, worker]
    steps:
      - uses: actions/checkout@v7
      - name: Go version from module
        id: go
        run: echo "version=$(awk '/^go / {print $2}' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/nexus-estate/nexus-${{ matrix.runtime }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=develop-latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.runtime }}
          build-args: GO_VERSION=${{ steps.go.outputs.version }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.runtime }}
          cache-to: type=gha,mode=max,scope=${{ matrix.runtime }}
