name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned protobuf tools
        run: |
          PROTOC_VERSION=$(awk '/^PROTOC_VERSION :=/ {print $3}' Makefile)
          GO_PLUGIN_VERSION=$(awk '/^PROTOC_GEN_GO_VERSION :=/ {print $3}' Makefile)
          GRPC_PLUGIN_VERSION=$(awk '/^PROTOC_GEN_GO_GRPC_VERSION :=/ {print $3}' Makefile)
          curl --fail --location --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" -o "$RUNNER_TEMP/protoc.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@"$GO_PLUGIN_VERSION"
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@"$GRPC_PLUGIN_VERSION"
      - name: Verify generated protobuf code
        run: |
          make proto
          git diff --exit-code -- proto gen
      - run: go mod download
      - name: Verify canonical module and runtime naming
        run: test "$(go list -m)" = "github.com/nexus-estate/nexus-estate-engine"
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: --timeout=5m
      - run: go test -race ./...
      - name: Module tidiness
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  build-binaries:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make build

  integration-search:
    name: Search integration
    runs-on: ubuntu-latest
    needs: [quality, build-binaries]
    env:
      COMPOSE_PROJECT_NAME: nexus-estate-engine-ci
      SEARCH_GRPC_PORT: 15052
      ELASTICSEARCH_PORT: 19200
      REDIS_PORT: 16379
      SEARCH_INTEGRATION_ADDR: localhost:15052
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Start Elasticsearch and Redis
        run: docker compose up -d --wait elasticsearch redis
      - name: Seed deterministic Search fixture
        run: |
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors \
            'http://localhost:19200/_cluster/health?wait_for_status=yellow&timeout=5s'
          curl --fail --silent --show-error -X PUT \
            'http://localhost:19200/nexus_estate_properties' \
            -H 'Content-Type: application/json' \
            -d '{"mappings":{"properties":{"publishedAt":{"type":"date"}}}}'
          curl --fail --silent --show-error -X PUT \
            'http://localhost:19200/nexus_estate_properties/_doc/foundation-1?refresh=true' \
            -H 'Content-Type: application/json' \
            -d '{"id":"foundation-1","title":"foundationfixture","publishedAt":"2026-01-01"}'
          curl --fail --silent --show-error -X PUT \
            'http://localhost:19200/nexus_estate_properties/_doc/foundation-fallback?refresh=true' \
            -H 'Content-Type: application/json' \
            -d '{"id":"foundation-fallback","title":"foundationfallback","publishedAt":"2026-01-02"}'
      - name: Start Search
        run: docker compose up -d --build search
      - name: Exercise Search with Redis
        run: |
          go test -v -count=1 -run '^TestSearchRuntime$' ./test/integration 2>&1 | tee /tmp/search-integration-redis.log
          if grep -q -- 'SKIP: TestSearchRuntime' /tmp/search-integration-redis.log; then
            echo 'Search integration was skipped'
            exit 1
          fi
          if docker compose logs search 2>&1 | grep -q -- 'redis unavailable'; then
            echo 'Search did not connect to Redis during the normal-path test'
            exit 1
          fi
          test "$(docker compose exec -T redis redis-cli --scan --pattern 'nexus-estate:search:properties:*' | wc -l)" -ge 1
      - name: Exercise Search without Redis
        run: |
          docker compose stop redis
          SEARCH_INTEGRATION_KEYWORD=foundationfallback SEARCH_INTEGRATION_EXPECTED_ID=foundation-fallback \
            go test -v -count=1 -run '^TestSearchRuntime$' ./test/integration 2>&1 | tee /tmp/search-integration-no-redis.log
          if grep -q -- 'SKIP: TestSearchRuntime' /tmp/search-integration-no-redis.log; then
            echo 'Search integration was skipped'
            exit 1
          fi
      - name: Verify Elasticsearch controls readiness without restarting Search
        run: |
          docker compose stop elasticsearch
          SEARCH_EXPECT_NOT_SERVING=1 go test -v -count=1 -run '^TestSearchReadinessDropsWhenElasticsearchStops$' ./test/integration
          test "$(docker compose ps --status running --services | grep -x search | wc -l)" -eq 1
      - name: Dump Search diagnostics on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs search || true
      - name: Tear down integration stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  smoke-core:
    name: Core health smoke
    runs-on: ubuntu-latest
    needs: [quality, build-binaries]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Start Core
        run: |
          go build -o /tmp/nexus-core ./cmd/core
          /tmp/nexus-core >/tmp/nexus-core.log 2>&1 &
          core_pid=$!
          trap 'kill -TERM "$core_pid" 2>/dev/null || true; wait "$core_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if CORE_SMOKE_ADDR=localhost:50051 go test -v -run '^TestCoreHealth$' ./test/integration; then
              kill -TERM "$core_pid"
              if ! timeout 15s tail --pid="$core_pid" -f /dev/null; then
                cat /tmp/nexus-core.log
                exit 1
              fi
              wait "$core_pid"
              trap - EXIT
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nexus-core.log
          exit 1

  smoke-worker:
    name: Worker lifecycle smoke
    runs-on: ubuntu-latest
    needs: [quality, build-binaries]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Start and stop Worker
        run: |
          go build -o /tmp/nexus-worker ./cmd/worker
          /tmp/nexus-worker >/tmp/nexus-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill -TERM "$worker_pid" 2>/dev/null || true' EXIT
          sleep 3
          kill -0 "$worker_pid"
          grep -q -- 'worker bootstrap started' /tmp/nexus-worker.log
          kill -TERM "$worker_pid"
          if ! timeout 15s tail --pid="$worker_pid" -f /dev/null; then
            cat /tmp/nexus-worker.log
            exit 1
          fi
          wait "$worker_pid"
          trap - EXIT

  docker-search:
    name: Docker Search
    runs-on: ubuntu-latest
    needs: [quality, build-binaries, integration-search]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Go version from module
        id: go
        run: echo "version=$(awk '/^go / {print $2}' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/nexus-estate/nexus-search
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=develop-latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: search
          build-args: GO_VERSION=${{ steps.go.outputs.version }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=search
          cache-to: type=gha,mode=max,scope=search

  docker-core:
    name: Docker Core
    runs-on: ubuntu-latest
    needs: [quality, build-binaries, smoke-core]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Go version from module
        id: go
        run: echo "version=$(awk '/^go / {print $2}' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/nexus-estate/nexus-core
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=develop-latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: core
          build-args: GO_VERSION=${{ steps.go.outputs.version }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=core
          cache-to: type=gha,mode=max,scope=core

  docker-worker:
    name: Docker Worker
    runs-on: ubuntu-latest
    needs: [quality, build-binaries, smoke-worker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Go version from module
        id: go
        run: echo "version=$(awk '/^go / {print $2}' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/nexus-estate/nexus-worker
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=develop-latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          build-args: GO_VERSION=${{ steps.go.outputs.version }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
